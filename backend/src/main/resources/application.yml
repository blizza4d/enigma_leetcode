server:
  port: 8080

spring:
  application:
    name: enigma-aggregator

enigma:
  roster:
    file-path: "classpath:members.json"
  scraper:
    thread-pool-size: 3
    task-timeout-seconds: 15
    rate-limit:
      base-interval-ms: 300
      max-jitter-ms: 100
    retry:
      max-attempts: 2
      initial-backoff-ms: 1000
    client:
      endpoint-url: "https://leetcode.com/graphql"
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
      referer: "https://leetcode.com"
      http-timeout-seconds: 15
  leaderboard:
    auto-refresh-cron: "0 */30 * * * *"
    refresh-on-startup: true
  cors:
    allowed-origins:
      - "*"
      - "http://localhost:3000"
      - "http://127.0.0.1:3000"
      - "https://*.vercel.app"
